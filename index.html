<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>numtax</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />
  <link rel="stylesheet" href="css/numtax.css" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-logo">num<strong>tax</strong></a>
    <div class="nav-links">
      <a href="index.html" class="nav-link nav-link--active">Classify</a>
      <a href="views.html" class="nav-link">Set Representation</a>
    </div>
    <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
      <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </nav>

  <main class="main">
    <header class="hero">
      <p class="hero-sub">Classify any integer across number-theoretic sets</p>
    </header>

    <form id="num-form" class="search-form">
      <div class="input-wrap">
        <input type="number" id="number" class="number-input" placeholder="Enter an integer…" min="0" max="9007199254740991" required />
        <button type="submit" class="submit-btn">Classify</button>
      </div>
    </form>

    <section id="results" class="results"></section>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script type="module" src="js/interface/theme.js"></script>
  <script type="module" src="js/interface/main.js"></script>
</body>
</html>
