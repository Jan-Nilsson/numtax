<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>numtax</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />
  <link rel="stylesheet" href="css/numtax.css" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>

<body>
  <div id="navbar-container"></div>

  <main class="main">
    <header class="hero">
      <p class="hero-sub">Classify any integer across number-theoretic sets</p>
    </header>

    <form id="num-form" class="search-form">
      <div class="input-wrap">
        <input type="number" id="number" class="number-input" placeholder="Enter an integer…" min="0"
          max="9007199254740991" required />
        <button type="submit" class="submit-btn">Classify</button>
      </div>
    </form>

    <section id="results" class="results"></section>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script type="module" src="js/interface/theme.js"></script>
  <script type="module" src="js/interface/main.js"></script>
  <script type="module" src="js/interface/navbar.js"></script>
</body>

</html>
