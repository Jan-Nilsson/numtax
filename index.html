
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Classify | Numtax</title>
  <meta
    name="description"
    content="Classify integers and explore their number-theoretic properties with Numtax."
  >

  <link rel="icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css"
  >
  <link rel="stylesheet" href="css/numtax.css">
  <link rel="stylesheet" href="css/classify.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/navbar.css">

  <script src="js/interface/navbar.js" defer></script>
  <script src="js/interface/theme.js" defer></script>
  <script src="js/interface/footer.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" defer></script>
  <script type="module" src="js/interface/main.js"></script>
</head>

<body class="classify-body">
  <div id="navbar-container"></div>

  <main class="main classify-page">
    <header class="hero classify-hero">
      <p class="classify-eyebrow">NUMTAX / INTEGER CLASSIFIER</p>

      <h1>Explore an integer.</h1>

      <p class="hero-sub">
        Investigate number-theoretic properties and discover how an integer
        connects to different mathematical sets.
      </p>
    </header>

    <form id="num-form" class="search-form">
      <label class="classify-label" for="number">Enter an integer</label>

      <div class="input-wrap">
        <input
          type="number"
          id="number"
          class="number-input"
          placeholder="e.g. 727"
          min="0"
          max="9007199254740991"
          step="1"
          aria-describedby="classify-help"
          required
        >

        <button type="submit" class="submit-btn">Classify</button>
      </div>

      <p id="classify-help" class="classify-help">
        Use a non-negative integer. The results will appear below.
      </p>
    </form>

    <section
      id="results"
      class="results"
      aria-live="polite"
      aria-label="Classification results"
    ></section>
  </main>

  <div id="footer-container"></div>
</body>
</html>
